[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "code_structure"
version = "0.0.1"
description = "How to use structure your code"
authors = [
  { name = "Rasmus", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ['requirements_dev.txt']}

[tool.ruff]
select = ["I"]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[project.scripts]
train = "code_structure.train:train"
evaluate = "code_structure.evaluate:evaluate"
visualize = "code_structure.visualize:visualize"
data = "code_structure.data:preprocess_data"
